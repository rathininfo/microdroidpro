name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Get Dependencies
        working-directory: android-sms-forwarder
        run: flutter pub get

      - name: Build APK
        working-directory: android-sms-forwarder
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-sms-forwarder/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "IVAC SMS Forwarder v1.0.3 (Cloud Ready)"
          body: "Direct download link for your Android Phone! Tap the APK below to download and install."
          draft: false
          prerelease: false
          files: android-sms-forwarder/build/app/outputs/flutter-apk/app-release.apk
