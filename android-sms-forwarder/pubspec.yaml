name: ivac_sms_forwarder
description: "Self-hosted Android Background SMS Forwarder (MacroDroid Alternative)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  another_telephony: ^0.4.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
